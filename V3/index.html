<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f8fafc">
<title>River Cross</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <h1 class="title">🛶 River Cross</h1>
    <nav class="scenarios" id="scenarioTabs" aria-label="Scenarios"></nav>
  </header>

  <div class="body">
    <main class="play">
      <section class="stage" aria-label="River">
        <div class="bank bank-left" id="bankLeft">
          <div class="bank-label"><span>🌿 Left Bank</span><span id="countLeft">0</span></div>
          <div class="slots" id="slotsLeft"></div>
        </div>

        <div class="river" id="river">
          <div class="flow"></div>
          <div class="boat at-left" id="boat">
            <div class="hull">
              <span class="oar oar-a"></span>
              <span class="oar oar-b"></span>
              <div class="hull-top">
                <span id="vehicleLabel">Row Boat</span>
                <span id="capacityLabel">2 seats</span>
              </div>
              <div class="seats" id="seats"></div>
              <div class="extras" id="extras"></div>
            </div>
            <span class="splash"></span>
          </div>
        </div>

        <div class="bank bank-right" id="bankRight">
          <div class="bank-label"><span>🏝️ Right Bank</span><span id="countRight">0</span></div>
          <div class="slots" id="slotsRight"></div>
        </div>
      </section>

      <section class="status" id="statusBanner">
        <p class="status-text" id="statusText" aria-live="polite">Tap a character on a bank to board the boat.</p>
        <div class="status-right">
          <button class="try-again" id="btnTryAgain" type="button" hidden>🔄 Try Again</button>
          <span class="pill" id="turnDisplay">Turns: 0</span>
        </div>
      </section>

      <section class="actions">
        <button class="btn-row" id="btnRow" type="button" disabled>🛶 Row Across</button>
        <div class="row-utils">
          <button class="btn-util" id="btnUndo" type="button" disabled>↩ Undo</button>
          <button class="btn-util" id="btnReplay" type="button" disabled title="Watch the last crossing and landing again">🎬 Last Landing</button>
          <button class="btn-util" id="btnReset" type="button">🔄 Reset</button>
          <button class="btn-util info-toggle" id="btnInfo" type="button">📖 Info</button>
        </div>
      </section>
    </main>

    <aside class="side" id="side" aria-label="Rules, history and builder">
      <div class="side-head">
        <div class="tabs" role="tablist">
          <button class="tab active" type="button" role="tab" data-tab="rules">📜 Rules</button>
          <button class="tab" type="button" role="tab" data-tab="history">📋 History</button>
          <button class="tab" type="button" role="tab" data-tab="build" id="tabBuild" hidden>⚙️ Build</button>
        </div>
        <button class="side-close" id="btnSideClose" type="button" aria-label="Close panel">✖</button>
      </div>

      <div class="side-body">
        <section class="panel active" data-panel="rules">
          <div id="ruleList"></div>
        </section>

        <section class="panel" data-panel="history">
          <div class="history" id="historyList"></div>
        </section>

        <section class="panel" data-panel="build">
          <label class="field-label" for="customCap">Boat seats</label>
          <div class="field">
            <input type="number" id="customCap" min="1" max="5" value="2" class="small">
          </div>

          <label class="field-label" for="charName">Add a character</label>
          <div class="field">
            <input type="text" id="charName" placeholder="Name" class="grow">
            <input type="text" id="charAbbr" placeholder="Abbr" maxlength="3" class="small">
            <select id="charType">
              <option value="human">Human</option>
              <option value="animal">Animal</option>
              <option value="object">Object</option>
            </select>
            <input type="text" id="charEmoji" placeholder="Emoji" maxlength="4" class="small">
            <button class="btn-util" id="btnAddChar" type="button">Add</button>
          </div>
          <div class="chip-list" id="customChips"></div>

          <label class="field-label" for="rulePredator">Add a danger rule</label>
          <div class="field">
            <select id="rulePredator" class="grow"></select>
            <span class="glue">harms</span>
            <select id="rulePrey" class="grow"></select>
          </div>
          <div class="field">
            <span class="glue">without</span>
            <select id="ruleProtector" class="grow"></select>
            <button class="btn-util" id="btnAddRule" type="button">Add rule</button>
          </div>

          <button class="btn-row launch" id="btnLaunch" type="button">🚀 Start Custom Game</button>
        </section>
      </div>
    </aside>
  </div>
</div>

<script src="js/scenarios.js"></script>
<script src="js/app.js"></script>
</body>
</html>
